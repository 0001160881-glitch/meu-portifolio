<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Portfólio de Gregorio Najera</title>
    <link rel="stylesheet" href="./estilo/style.css">
</head>
<body>

    <header class="cabecalho">
        <a href="index.html" id="logo">Meu Portfólio</a>
        <nav class="menu">
            <a href="index.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="projeto.html">Projetos</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>
        <section id="contato-form" class="secao">
            <div class="container">
                <h2>Vamos Conversar!</h2>
                <p>Se tiver alguma pergunta preencha o formulário abaixo.</p>

                <form class="formulario-contato">
                    <div class="form-group">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="mensagem">Mensagem:</label>
                        <textarea id="mensagem" name="mensagem" rows="6" required></textarea>
                    </div>
                    <button type="submit" class="btn">Enviar Mensagem</button>
                </form>

                <div class="info-contato">
                    <h3>Outras formas de contato</h3>
                    <p><strong>Email:</strong> seuemail@example.com</p>
                    <p><strong>LinkedIn:</strong> linkedin.com/in/seu-usuario</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="rodape">
        <p>&copy; 2025 - Gregorio Najera. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
